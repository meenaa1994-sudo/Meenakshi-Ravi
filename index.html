<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form creation</title>
</head>
<body>
    <h2>Form Details</h2>
    <hr>
    <form>
        <label>First name</label><br>
        <input type="name" placeholder="firstname"/><br>
        <label>Password</label><br>
        <input type="password" /><br>
        <label>select the subjects</label><br>
        <select>
            <option>cse</option>
            <option>eee</option>
            <option>ece</option>
            <option>IT</option>
        </select>
        <h3>select the gender</h3>
        <label>Male</label><input type="radio" name="gender"/>
        <label>Female</label><input type="radio" name="gender" />
        <br>
        <h3>select the course</h3>
        <label>html</label><input type="checkbox" name="gender"/><br>
        <label>css</label><input type="checkbox" name="gender"/><br>
        <label>JAVA</label><input type="checkbox" name="gender"/><br>
        <br>

        <label>select the date</label><br>
        <input type="date" /><br>
        <label>upload ur resume</label><br>
        <input type="file" /><br>

        <textarea cols="10" rows="5">

        </textarea>
        <button>submit</button>

     </form>
   
</body>
    
</html>
